<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איחוד הצלה | סימולטור מקרים – ABCDE</title>
<meta name="theme-color" content="#E8691A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מדריך שטח">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --panel:#FFFFFF; --panel2:#F5F7FB; --ink:#16213A; --muted:#5D6B82; --line:#D8DEE8;
  --acc:#E8691A; --acc2:#F59A3C; --acc-ink:#FFFFFF; --ok:#17915A; --ok-bg:#E3F5EC; --bad:#CF2E2E; --bad-bg:#FBE7E7; --warn:#B7740B; --warn-bg:#FFF3DD;
  --mon:#0E1626; --mon-ink:#E6EDF7; --mon-val:#4BE3A0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --panel:#142036; --panel2:#1A2842; --ink:#E8EEF8; --muted:#93A3BC; --line:#26354F;
    --ok:#3FD08A; --ok-bg:#0F3324; --bad:#FF6B6B; --bad-bg:#3A1717; --warn:#F2B24A; --warn-bg:#3A2A0E;
    --mon:#070C16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --panel:#142036; --panel2:#1A2842; --ink:#E8EEF8; --muted:#93A3BC; --line:#26354F;
  --ok:#3FD08A; --ok-bg:#0F3324; --bad:#FF6B6B; --bad-bg:#3A1717; --warn:#F2B24A; --warn-bg:#3A2A0E;
  --mon:#070C16; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Rubik',Arial,sans-serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:960px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
.logo::before{content:"";width:18px;height:18px;background:
  linear-gradient(#fff,#fff) center/6px 18px no-repeat,linear-gradient(#fff,#fff) center/18px 6px no-repeat}
.lchip{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;flex:none;border:1px solid var(--line)}
.lchip img{height:34px;width:auto;display:block}
.hero-logo{background:#fff;border-radius:14px;padding:10px 16px;display:inline-block;margin-bottom:12px;border:1px solid var(--line)}
.hero-logo img{height:64px;width:auto;display:block}
.vtabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.vtabs a{text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem;padding:6px 12px;border-radius:9px;white-space:nowrap}
.vtabs a[aria-current="page"]{background:var(--acc);color:var(--acc-ink)}
.vtabs a:focus-visible{outline:3px solid var(--acc2);outline-offset:1px}
#learnFrame{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;background:var(--bg)}
.brand b{font-size:1.05rem;font-weight:800;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.8rem}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:.92rem;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
.timer b{color:var(--ok);font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;direction:ltr;display:inline-block}
.timer.low b{color:var(--bad)}
.steps{max-width:960px;margin:0 auto;padding:0 14px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps span{flex:none;font-size:.8rem;padding:4px 10px;border-radius:8px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.steps span.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.steps span.done{color:var(--ok);border-color:var(--ok)}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0;transition:width .4s}

main{max-width:960px;margin:0 auto;padding:18px 14px 50px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 6px}
h2{font-size:1.25rem;font-weight:700;margin:0 0 10px}
.muted{color:var(--muted)}

/* menu */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.case{text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.case:hover{border-color:var(--acc);transform:translateY(-2px)}
.case .top{display:flex;align-items:center;gap:8px}
.case .em{font-size:1.5rem}
.case b{font-size:1.05rem}
.case .meta{color:var(--muted);font-size:.85rem}
.best{margin-inline-start:auto;font-size:.78rem;color:var(--ok);font-weight:700}
.opts-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}

/* dispatch */
.dispatch{border:1px solid var(--acc);background:linear-gradient(90deg,rgba(232,105,26,.12),transparent);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.siren{width:42px;height:42px;border-radius:50%;background:var(--bad);display:grid;place-items:center;font-size:1.3rem;flex:none;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(207,46,46,.18)}}
@media (prefers-reduced-motion:reduce){.siren{animation:none}}
.dispatch small{color:var(--acc);font-weight:700}
.dispatch h2{margin:2px 0 0}
.code{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:8px;white-space:nowrap}
.brief{margin-top:12px;background:var(--panel2);border-radius:12px;padding:12px 14px}
.brief p{margin:4px 0}
.btn{border:none;border-radius:12px;padding:12px 22px;font-weight:700;font-size:1.02rem}
.btn.go{background:linear-gradient(90deg,var(--acc2),var(--acc));color:var(--acc-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.full{width:100%;margin-top:14px}

/* monitor */
.mon{background:var(--mon);color:var(--mon-ink);border-radius:14px;padding:12px;margin:14px 0}
.mon h3{margin:0 0 8px;font-size:.85rem;color:var(--mon-val);font-weight:500;display:flex;align-items:center;gap:6px}
.mon h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mon-val);animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.mon h3::before{animation:none}}
.vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.vit div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 8px;text-align:center}
.vit small{display:block;color:#93A3BC;font-size:.72rem}
.vit b{font-size:1.15rem;color:var(--mon-val);direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
.vit b.alert{color:#FF7A7A}
.vit div.flash{animation:fl 1s}
@keyframes fl{0%{background:rgba(75,227,160,.35)}100%{background:rgba(255,255,255,.05)}}

.scene{border-inline-start:4px solid var(--acc);background:var(--panel2);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.scene small{color:var(--acc);font-weight:700}
.stagehead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tag{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.82rem}
.tag.acc{border-color:var(--acc);color:var(--acc);font-weight:700}
.tag.pts{margin-inline-start:auto;border-color:var(--ok);color:var(--ok);font-weight:700}
.q{font-size:1.15rem;font-weight:700;margin:4px 0 2px}
.hint{color:var(--acc);font-size:.85rem;margin-bottom:10px}

.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink);transition:border-color .12s}
.opt:hover:not([disabled]){border-color:var(--acc2)}
.opt .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:.8rem}
.opt.radio .box{border-radius:50%}
.opt.sel{border-color:var(--acc)}
.opt.sel .box{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.sel .box::after{content:"✓"}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.ord{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;transition:transform .15s}
.ord .n{width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ord .t{flex:1}
.ord button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1rem}
.ord button[disabled]{opacity:.3}
.ord.right{border-color:var(--ok);background:var(--ok-bg)}
.ord.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;border:1px solid}
.fb.g{background:var(--ok-bg);border-color:var(--ok)}
.fb.p{background:var(--warn-bg);border-color:var(--warn)}
.fb.b{background:var(--bad-bg);border-color:var(--bad)}
.fb b{display:flex;justify-content:space-between;gap:8px}
.fb p{margin:6px 0 0}

/* summary */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:96px;height:96px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:1.7rem;font-weight:800}
.rev{margin-top:16px}
.rev details{background:var(--panel2);border-radius:10px;padding:10px 12px;margin:6px 0}
.rev summary{cursor:pointer;display:flex;gap:8px;align-items:baseline}
.rev summary .s{margin-inline-start:auto;font-weight:700;white-space:nowrap}
.rev p{margin:8px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media (max-width:560px){h1{font-size:1.35rem}.brand small{display:none}.btn{padding:12px 16px}}

/* ---------- field guide ---------- */
#fieldView{max-width:960px;margin:0 auto;padding:16px 14px 70px}
#fieldView a{text-decoration:none}
.fg-top{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.fg-top h1{flex:1;min-width:0}
.fg-top h1{margin:0;font-size:1.5rem}
.fg-top .sub{color:var(--muted);font-size:.9rem;flex-basis:100%;margin-top:-6px}
.fg-back{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.fg-search{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);margin-bottom:14px}
.fg-search:focus{outline:3px solid var(--acc2);outline-offset:1px;border-color:var(--acc)}
.fg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fg-tile{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:18px 12px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:1.08rem;font-weight:800;color:var(--ink);text-align:center;line-height:1.25;transition:border-color .15s,transform .15s}
.fg-tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.fg-tile .em{font-size:2.1rem;line-height:1;width:100%;text-align:center}
.fg-tile.sub{background:var(--panel2);min-height:84px;font-size:.98rem}
.fg-h{font-size:.85rem;color:var(--muted);font-weight:700;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.fg-row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;color:var(--ink);transition:border-color .12s}
.fg-row:hover{border-color:var(--acc)}
.fg-row .em{font-size:1.55rem;flex:none;width:36px;text-align:center}
.fg-row .txt{flex:1;min-width:0}
.fg-row b{font-size:1.12rem;display:block;line-height:1.3}
.fg-row .key{color:var(--muted);font-size:.93rem;line-height:1.35;display:block;margin-top:2px}
.fg-row .arr{margin-inline-start:auto;color:var(--muted);font-size:1.25rem;flex:none}
.fg-card h1{font-size:1.75rem;margin:0;display:flex;align-items:center;gap:10px}
.fg-card .en{color:var(--muted);font-size:1rem;font-weight:400;direction:ltr}
.fg-key{border-inline-start:4px solid var(--acc);background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:1.08rem;margin:12px 0}
.fg-key small{display:block;color:var(--acc);font-weight:700;font-size:.8rem;margin-bottom:2px}
.fg-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.fg-chips span{background:var(--mon);color:var(--mon-val);border-radius:10px;padding:8px 12px;font-weight:800;font-size:1.02rem;line-height:1.2}
.fg-sec{border-radius:12px;padding:12px 14px;margin:10px 0;border-inline-start:5px solid var(--c);background:var(--cb)}
.fg-sec h3{margin:0 0 6px;color:var(--c);font-size:.92rem;font-weight:800}
.fg-sec p{margin:0;font-size:1.08rem}
.fg-sec.treat{--c:var(--ok);--cb:var(--ok-bg)}
.fg-sec.danger{--c:var(--bad);--cb:var(--bad-bg)}
.fg-sec.ask{--c:var(--warn);--cb:var(--warn-bg)}
.fg-list{margin:0;padding:0;list-style:none;counter-reset:s}
.fg-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.18);font-size:1.12rem;line-height:1.4}
.fg-list li:last-child{border:none}
.fg-list li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:.92rem;margin-top:2px}
.fg-list.ask li::before{content:"?"}
.fg-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.fg-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fg-num{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.fg-num b{display:block;font-size:1.35rem;color:var(--ok)}
.fg-num small{color:var(--muted)}
.fg-empty{color:var(--muted);text-align:center;padding:30px 0}
@media (max-width:560px){.fg-grid{grid-template-columns:repeat(2,1fr)}.fg-tile{min-height:104px;font-size:1rem;padding:14px 10px}.fg-card h1{font-size:1.5rem}}

/* ---------- field tools: metronome + timers ---------- */
.ft-wrap{display:grid;gap:14px}
.ft-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.ft-box h2{margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ft-metro{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ft-beat{width:96px;height:96px;border-radius:50%;background:var(--panel2);border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:1.3rem;flex:none;transition:transform .05s,background .05s}
.ft-beat.on{background:var(--acc);border-color:var(--acc2);color:#fff;transform:scale(1.08)}
.ft-bpm{display:flex;align-items:center;gap:8px}
.ft-bpm b{font-size:1.6rem;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.ft-bpm button,.ft-tm button.sm{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:1.2rem;font-weight:800}
.ft-big{border:none;border-radius:14px;padding:14px 22px;font-weight:800;font-size:1.1rem;min-width:140px}
.ft-big.start{background:var(--ok);color:#fff}
.ft-big.stop{background:var(--bad);color:#fff}
.ft-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.ft-presets button{background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:14px 10px;color:var(--ink);font-weight:800;font-size:1rem;display:flex;flex-direction:column;gap:4px;align-items:center}
.ft-presets button small{color:var(--muted);font-weight:600}
.ft-presets button:hover{border-color:var(--acc)}
.ft-tm{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.ft-tm .t{font-family:ui-monospace,Menlo,monospace;font-size:2rem;font-weight:800;direction:ltr;min-width:110px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ok)}
.ft-tm.low .t{color:var(--warn)}
.ft-tm.done{border-color:var(--bad);background:var(--bad-bg);animation:ftblink 1s infinite}
.ft-tm.done .t{color:var(--bad)}
@keyframes ftblink{50%{border-color:transparent}}
@media (prefers-reduced-motion:reduce){.ft-tm.done{animation:none}}
.ft-tm .l{flex:1;min-width:0}.ft-tm .l b{display:block}.ft-tm .l small{color:var(--muted)}
.ft-tm .x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.1rem}
.ft-badge{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline-start:14px;z-index:20;background:var(--mon);color:var(--mon-ink);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:10px 16px;font-weight:800;text-decoration:none;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.ft-badge b{font-family:ui-monospace,Menlo,monospace;direction:ltr;color:var(--mon-val)}
.ft-badge.alarm{background:var(--bad);color:#fff}.ft-badge.alarm b{color:#fff}
.ft-note{color:var(--muted);font-size:.9rem;margin:8px 0 0}
</style>
</head>
<body>

/* ---------- BRIEF ---------- */
function brief(c){
  setBar(false);
  app.innerHTML=`<div class="card">
    <div class="dispatch"><span class="siren" aria-hidden="true">🚨</span><div><small>הזנקת חירום</small><h2>${c.title}</h2></div><span class="code">${c.code}</span></div>
    <div class="brief"><b>📟 תקציר הזנקה</b>
      <p><b>מטופל:</b> ${c.patient}</p><p><b>סיפור מקרה:</b> ${c.story}</p>
      <p><b>משימה:</b> נהל את המקרה לפי השלבים: ${c.stages.map(s=>s.tab).join(' ← ')}</p></div>
    <div class="row"><button class="btn go" id="start" style="flex:1">🚑 צא למקרה!</button><button class="btn ghost" id="back">חזרה</button></div>
  </div>`;
  $('#start').onclick=()=>start(c);$('#back').onclick=menu;
}

/* ---------- GAME ---------- */
function start(c){
  S={c,i:0,score:0,max:c.stages.length*10,log:[],vit:{avpu:'--',rr:'--',spo2:'--',hr:'--',bp:'--',sugar:'--'},left:chosenMin*60};
  setBar(true);$('#scoreV').textContent=0;$('#scoreMax').textContent=S.max;
  clearInterval(timerId);
  if(chosenMin){tick();timerId=setInterval(()=>{if(VIEW==='learn')return;S.left--;tick();if(S.left<=0){clearInterval(timerId);end(true)}},1000)}else $('#timerPill').hidden=true;
  stage();
}
function tick(){const m=String(Math.floor(S.left/60)).padStart(2,'0'),s=String(S.left%60).padStart(2,'0');$('#timerV').textContent=m+':'+s;$('#timerPill').classList.toggle('low',S.left<=30)}
function steps(){
  $('#steps').innerHTML=S.c.stages.map((s,i)=>`<span class="${i<S.i?'done':i===S.i?'on':''}">${i+1}. ${s.tab}${i<S.i?' ✓':''}</span>`).join('');
  $('#steps .on')?.scrollIntoView({inline:'center',block:'nearest'});
  $('#progBar').style.width=(S.i/S.c.stages.length*100)+'%';
}
const LBL={avpu:'AVPU',rr:'נשימות',spo2:'SpO₂',hr:'דופק',bp:'ל"ד',sugar:'סוכר'};
function alertVal(k,v){const n=parseFloat(v);if(isNaN(n))return k==='avpu'&&v!=='A'&&v!=='--';
  return {rr:n>20||n<12,spo2:n<94,hr:n>100||n<60,bp:n>140||n<90,sugar:n<60||n>100}[k]}
function monitor(newKeys=[]){
  return `<div class="mon" aria-live="polite"><h3>מוניטור מדדים</h3><div class="vit">${Object.keys(LBL).map(k=>`<div class="${newKeys.includes(k)?'flash':''}"><small>${LBL[k]}</small><b class="${alertVal(k,S.vit[k])?'alert':''}">${S.vit[k]}</b></div>`).join('')}</div></div>`;
}
function stage(){
  const st=S.c.stages[S.i], q=st.q; steps();
  const nk=Object.keys(st.reveal||{}); Object.assign(S.vit,st.reveal||{});
  let body='';
  if(q.type==='order'){
    let cur; do{cur=shuffle(q.items.map((t,i)=>i))}while(cur.every((v,i)=>v===i));
    S.cur=cur;
  } else S.cur=shuffle(q.opts.map((o,i)=>i));
  S.sel=new Set(); S.done=false;
  const need=q.type==='multi'?q.opts.filter(o=>o[1]).length:0;
  app.innerHTML=`<div class="card">
    <div class="stagehead"><span class="tag acc">שלב ${S.i+1}/${S.c.stages.length}</span><span class="tag">${st.tab}</span><span class="tag pts">10 נק'</span></div>
    ${monitor(nk)}
    <div class="scene"><small>📋 מצב בזירה</small><div>${st.scene}</div></div>
    <div class="q">${q.text}</div>
    <div class="hint">${q.type==='order'?'השתמש בחיצים כדי לסדר':q.type==='multi'?`סמן ${need} תשובות נכונות`:'בחר תשובה אחת'}</div>
    <div id="qa"></div>
    <button class="btn go full" id="check">✓ אשר תשובה ובדוק</button>
    <div id="fb"></div></div>`;
  drawQ(); $('#check').onclick=check; scrollTo(0,0);
}
function drawQ(res){
  const q=S.c.stages[S.i].q, qa=$('#qa');
  if(q.type==='order'){
    qa.innerHTML=S.cur.map((it,pos)=>`<div class="ord ${res?(it===pos?'right':'wrong'):''}"><span class="n">${pos+1}</span><span class="t">${q.items[it]}</span>
      ${res?'':`<button aria-label="למעלה" data-u="${pos}" ${pos===0?'disabled':''}>▲</button><button aria-label="למטה" data-d="${pos}" ${pos===S.cur.length-1?'disabled':''}>▼</button>`}</div>`).join('');
    qa.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const p=+b.dataset.u;[S.cur[p-1],S.cur[p]]=[S.cur[p],S.cur[p-1]];drawQ()});
    qa.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const p=+b.dataset.d;[S.cur[p+1],S.cur[p]]=[S.cur[p],S.cur[p+1]];drawQ()});
  } else {
    qa.innerHTML=S.cur.map(i=>{const o=q.opts[i],s=S.sel.has(i);let cls='';
      if(res){cls=o[1]&&s?'right':!o[1]&&s?'wrong':o[1]?'miss':''}
      return `<button class="opt ${q.type==='single'?'radio':''} ${s?'sel':''} ${cls}" data-i="${i}" ${res?'disabled':''} aria-pressed="${s}"><span class="box"></span><span>${o[0]}</span></button>`}).join('');
    qa.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
      if(q.type==='single'){S.sel=new Set([i])}else{S.sel.has(i)?S.sel.delete(i):S.sel.add(i)}drawQ()});
  }
}
function check(){
  const q=S.c.stages[S.i].q;
  if(q.type!=='order'&&!S.sel.size){$('#fb').innerHTML='<div class="fb p"><b>בחר תשובה קודם 🙂</b></div>';return}
  let pts;
  if(q.type==='order'){pts=Math.round(S.cur.filter((v,i)=>v===i).length/S.cur.length*10)}
  else if(q.type==='single'){pts=q.opts[[...S.sel][0]][1]?10:0}
  else{const need=q.opts.filter(o=>o[1]).length,hit=[...S.sel].filter(i=>q.opts[i][1]).length,bad=S.sel.size-hit;pts=Math.max(0,Math.round((hit-bad)/need*10))}
  S.score+=pts;$('#scoreV').textContent=S.score;
  S.log.push({tab:S.c.stages[S.i].tab,q:q.text,pts,explain:q.explain});
  drawQ(true);
  const cls=pts===10?'g':pts>0?'p':'b', t=pts===10?'✅ תשובה נכונה!':pts>0?'⚠️ תשובה נכונה חלקית':'❌ לא נכון';
  const ordFix=q.type==='order'&&pts<10?`<p><b>הסדר הנכון:</b> ${q.items.map((x,i)=>(i+1)+'. '+x).join(' · ')}</p>`:'';
  const last=S.i===S.c.stages.length-1;
  $('#check').outerHTML=`<button class="btn ok full" id="next">${last?'🏁 לסיכום המקרה':'המשך לשלב הבא ←'}</button>`;
  $('#fb').innerHTML=`<div class="fb ${cls}"><b><span>${t}</span><span>+${pts}/10</span></b><p>${q.explain}</p>${ordFix}</div>`;
  $('#next').onclick=()=>{S.i++; last?end(false):stage()};
  $('#next').focus({preventScroll:true});
}
function end(timeout){
  clearInterval(timerId);
  const pct=Math.round(S.score/S.max*100); saveBest(S.c.id,pct);
  $('#progBar').style.width='100%'; S.i=S.c.stages.length; steps();
  const [c,msg]=pct>=90?['var(--ok)','מצוין! ניהול מקרה ברמה גבוהה 🏆']:pct>=70?['var(--ok)','טוב מאוד – עוד קצת חידוד 💪']:pct>=50?['var(--warn)','בסדר – כדאי לחזור על החומר 📚']:['var(--bad)','שווה לעבור שוב על הסיכום 🔁'];
  const missed=S.c.stages.slice(S.log.length);
  app.innerHTML=`<div class="card">
    ${timeout?'<div class="fb b" style="margin:0 0 14px"><b>⏰ נגמר הזמן!</b></div>':''}
    <div class="score"><div class="ring" style="--p:${pct};--c:${c}"><div>${pct}%</div></div>
      <div><small class="muted">${S.c.dx}</small><h1>${msg}</h1><p class="muted" style="margin:0">צברת ${S.score} מתוך ${S.max} נקודות</p></div></div>

function openLearnAt(id){

/* ---------- FIELD TOOLS: metronome + timers (work offline, no deps) ---------- */
const FT={ctx:null,metro:{on:false,bpm:110,next:0,beat:0,timer:null},timers:[],tick:null,wake:null};
const FT_PRESETS={
  aed:{label:'AED – סבב 2 דק\'',sub:'עיסויים עד האנליזה הבאה',sec:120,loop:true},
  epi:{label:'אפיפן – 5 דק\'',sub:'אין שיפור? אישור מוקד למנה שנייה',sec:300},
  sugar:{label:'סוכר חוזר – 5 דק\'',sub:'בדיקה חוזרת אחרי גלוקוג\'ל',sec:300},
  t10:{label:'10 דקות',sub:'טיימר כללי',sec:600},
};
function ftAudio(){if(!FT.ctx){try{FT.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(FT.ctx&&FT.ctx.state==='suspended')FT.ctx.resume(); return FT.ctx}
function ftBeep(at,freq,dur,gain){const c=FT.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(gain,at);g.gain.exponentialRampToValueAtTime(0.0001,at+dur);o.connect(g).connect(c.destination);o.start(at);o.stop(at+dur+0.02)}
function ftAlarm(){const c=ftAudio();if(c){const t=c.currentTime;for(let i=0;i<4;i++)ftBeep(t+i*0.25,880,0.18,0.5)} if(navigator.vibrate)navigator.vibrate([300,120,300,120,300])}
async function ftWake(on){try{if(on&&!FT.wake&&navigator.wakeLock){FT.wake=await navigator.wakeLock.request('screen');FT.wake.addEventListener('release',()=>{FT.wake=null})}else if(!on&&FT.wake){await FT.wake.release();FT.wake=null}}catch(e){}}
function ftMetroSched(){const c=FT.ctx,m=FT.metro;if(!c||!m.on)return;const iv=60/m.bpm;
  while(m.next<c.currentTime+0.15){const accent=m.beat%10===0;ftBeep(m.next,accent?1100:800,0.05,0.35);
    const delay=Math.max(0,(m.next-c.currentTime)*1000);setTimeout(()=>{const b=document.getElementById('ftBeat');if(b){b.classList.add('on');b.textContent=(m.beat%10)+1;setTimeout(()=>b.classList.remove('on'),90)}},delay);
    m.next+=iv;m.beat++}}
function ftMetro(on){const m=FT.metro;if(on){if(!ftAudio())return;m.on=true;m.beat=0;m.next=FT.ctx.currentTime+0.05;m.timer=setInterval(ftMetroSched,25);ftWake(true)}else{m.on=false;clearInterval(m.timer);ftWake(false)}ftRenderTools();ftBadge()}
function ftBpm(d){FT.metro.bpm=Math.min(120,Math.max(100,FT.metro.bpm+d));const e=document.getElementById('ftBpm');if(e)e.textContent=FT.metro.bpm}
function ftStart(key){const p=FT_PRESETS[key];if(!p)return;ftAudio();FT.timers.push({id:Date.now()+Math.random(),key,label:p.label,sub:p.sub,sec:p.sec,end:Date.now()+p.sec*1000,loop:!!p.loop,done:false});if(!FT.tick)FT.tick=setInterval(ftTick,250);ftRenderTools();ftBadge()}
function ftStop(id){FT.timers=FT.timers.filter(t=>t.id!==id);if(!FT.timers.length){clearInterval(FT.tick);FT.tick=null}ftRenderTools();ftBadge()}
function ftFmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function ftTick(){const now=Date.now();for(const t of FT.timers){if(!t.done&&now>=t.end){ftAlarm();if(t.loop){t.end=now+t.sec*1000}else t.done=true}
  const el=document.getElementById('ft-'+t.id);if(el){const left=t.end-now;el.querySelector('.t').textContent=t.done?'00:00':ftFmt(left);el.classList.toggle('low',!t.done&&left<15000);el.classList.toggle('done',t.done)}}
  ftBadge()}
function ftBadge(){let b=document.getElementById('ftBadge');const active=FT.metro.on||FT.timers.length;const onTools=location.hash.startsWith('#field/tools');
  if(!active||onTools){if(b)b.remove();return}
  if(!b){b=document.createElement('a');b.id='ftBadge';b.className='ft-badge';b.href='#field/tools';document.body.appendChild(b)}
  const t=FT.timers[0];const done=FT.timers.some(x=>x.done);b.classList.toggle('alarm',done);
  b.innerHTML=(FT.metro.on?'<span>♩ '+FT.metro.bpm+'</span>':'')+(t?`<span>${t.done?'⏰':'⏱'}</span><b>${t.done?'00:00':ftFmt(t.end-Date.now())}</b>`:'')}
function ftRenderTools(){const host=document.getElementById('ftTools');if(!host)return;const m=FT.metro;
  host.innerHTML=`<div class="ft-wrap">
   <div class="ft-box"><h2>♩ מטרונום עיסויים</h2>
    <div class="ft-metro"><div class="ft-beat" id="ftBeat">${m.on?'':'▶'}</div>
     <div class="ft-bpm"><button type="button" onclick="ftBpm(-5)" aria-label="פחות">−</button><b id="ftBpm">${m.bpm}</b><button type="button" onclick="ftBpm(5)" aria-label="יותר">+</button><span class="muted">לדקה</span></div>
     <button type="button" class="ft-big ${m.on?'stop':'start'}" onclick="ftMetro(${!m.on})">${m.on?'■ עצור':'▶ התחל'}</button></div>
    <p class="ft-note">קצב 100–120 לדקה, עומק 5–6 ס"מ. כל 10 עיסויים צליל גבוה יותר. המסך נשאר דולק בזמן הפעלה.</p></div>
   <div class="ft-box"><h2>⏱ טיימרים</h2>
    <div class="ft-presets">${Object.entries(FT_PRESETS).map(([k,p])=>`<button type="button" onclick="ftStart('${k}')">${p.label}<small>${p.sub}</small></button>`).join('')}</div>
    <div id="ftList">${FT.timers.map(t=>`<div class="ft-tm${t.done?' done':''}" id="ft-${t.id}"><span class="t">${t.done?'00:00':ftFmt(t.end-Date.now())}</span><span class="l"><b>${t.label}${t.loop?' 🔁':''}</b><small>${t.done?'הזמן נגמר':t.sub}</small></span><button type="button" class="x" onclick="ftStop(${t.id})" aria-label="בטל">✕</button></div>`).join('')||'<p class="ft-note">אין טיימר פעיל. בחר למעלה – אפשר כמה במקביל.</p>'}</div>
    <p class="ft-note">בסיום: צפצוף ורטט. הטיימרים ממשיכים לרוץ גם כשעוברים לכרטיס אחר (בועה בתחתית המסך).</p></div></div>`}
function ftAuto(key){if(key==='cpr'){if(!FT.metro.on)ftMetro(true);if(!FT.timers.some(t=>t.key==='aed'))ftStart('aed')}else if(FT_PRESETS[key]&&!FT.timers.some(t=>t.key===key))ftStart(key)}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
menu();route();
</script>
</body>
</html>
